{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        DeepGuard
        {% endblock %}
    </title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{% static 'detector/css/style.css' %}"
    >

</head>


<body>


<!-- Navigation -->
<nav class="navbar navbar-expand-lg border-bottom bg-white">

    <div class="container">

        <a
            class="navbar-brand d-flex align-items-center gap-2 fw-semibold"
            href="/"
        >

            <i class="bi bi-shield-check text-primary"></i>

            <span>DeepGuard</span>

        </a>


        <span class="navbar-text small text-muted d-none d-md-block">

            Video Authenticity Detection

        </span>

    </div>

</nav>


<!-- Main Content -->
<main>

    {% block content %}
    {% endblock %}

</main>


<!-- Footer -->
<footer class="border-top bg-white py-4 mt-5">

    <div class="container">

        <div class="row align-items-center">

            <div class="col-md-6">

                <p class="mb-1 fw-semibold">
                    DeepGuard
                </p>

                <p class="text-muted small mb-0">
                    Deep learning based video analysis.
                </p>

            </div>


            <div class="col-md-6 text-md-end mt-3 mt-md-0">

                <p class="text-muted small mb-0">
                    © 2026 DeepGuard
                </p>

            </div>

        </div>

    </div>

</footer>


</body>

</html>
